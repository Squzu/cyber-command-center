<style>
:root{--fs:14px;--lh:20px;--ff:Consolas,monospace;--tab:4}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--uibg);color:var(--uifg);font:12px/1.2 "Segoe UI",system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column}
#menubar{display:flex;flex:none;height:24px;border-bottom:1px solid var(--uibd);background:var(--uibg)}
.mb{padding:0 10px;line-height:24px;cursor:default}
.mb:hover,.mb.on{background:var(--hov)}
#toolbar{display:flex;flex:none;gap:1px;padding:2px 4px;border-bottom:1px solid var(--uibd);overflow-x:auto;align-items:center}
.tb{flex:none;width:28px;height:26px;border:1px solid transparent;background:none;color:var(--uifg);display:flex;align-items:center;justify-content:center;border-radius:3px;cursor:pointer;padding:0}
.tb:hover{background:var(--hov);border-color:var(--uibd)}
.tb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tsep{flex:none;width:1px;height:20px;background:var(--uibd);margin:0 5px}
#tabs{display:flex;flex:none;height:28px;background:var(--tabbg);border-bottom:1px solid var(--uibd);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}

function tokenize(text,lang){
  if(!lang._re)lang._re=new RegExp(lang.rules.map(r=>'('+(r[1] instanceof RegExp?r[1].source:r[1])+')').join('|'),'gm');

  while((m=re.exec(text))){

    let gi=1;while(m[gi]===undefined)gi++;

    if(m.index>last)out.push([null,text.slice(last,m.index)]);
    if(rule[2])rule[2](m[0],out);else out.push([rule[0],m[0]]);
    last=m.index+m[0].length;
  }
  if(last<text.length)out.push([null,text.slice(last)]);
  return out;
}
function detectLang(name,text){

  if(/^<!doctype html|^<html/i.test(first))return'html';
  if(/^<\?xml/.test(first))return'xml';
  return'text';
}

function modal(title,body,buttons=[{label:'OK',primary:true}],opts={}){

    const ov=h('div',{class:'ov'}),foot=h('div',{class:'mf'});
    const box=h('div',{class:'mbox',style:{width:(opts.w||420)+'px'}},h('div',{class:'mh'},title),h('div',{class:'mbody'},body),foot);
    const kd=e=>{

      else if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='BUTTON'&&opts.enter!==false){
        const p=foot.querySelector('.pri');if(p){e.preventDefault();e.stopPropagation();p.click()}
      }
    };
    const done=v=>{ov.remove();document.removeEventListener('keydown',kd,true);res(v);cur&&cur.ta.focus()};
    buttons.forEach(b=>foot.append(h('button',{class:b.primary?'pri':'',onclick:()=>{if(b.fn&&b.fn()===false)return;done(b.label)}},b.label)));
    document.addEventListener('keydown',kd,true);
    ov.addEventListener('mousedown',e=>{if(e.target===ov&&opts.dismiss!==false)done(null)});
    ov.append(box);document.body.append(ov);

}

const FF={dir:null,files:null};
function parseFilters(){
  const inc=[],exc=[],xd=[];
  const g=p=>new RegExp('^'+p.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$','i');
  for(const t of fq('ffilt').value.split(/[\s;,]+/).filter(Boolean)){
    if(/^!\+?\\/.test(t))xd.push(g(t.replace(/^!\+?\\/,'')));
    else if(t[0]==='!')exc.push(g(t.slice(1)));
    else inc.push(g(t==='*.*'?'*':t));
  }
  if(!inc.length)inc.push(/^/);
  return{file:n=>inc.some(r=>r.test(n))&&!exc.some(r=>r.test(n)),dir:n=>!xd.some(r=>r.test(n))};
}
async function collectFiles(){
  const flt=parseFilters(),sub=fq('fsub').checked,hid=fq('fhid').checked,out=[];
  const okDir=n=>(hid||n[0]!=='.')&&flt.dir(n);
  if(FF.dir){
    const walk=async(dir,path)=>{
      for await(const [name,hd] of dir.entries()){
        if(hd.kind==='directory'){if(sub&&okDir(name))await walk(hd,path+'/'+name)}
        else if(flt.file(name))out.push({name,path:path+'/'+name,handle:hd,getFile:()=>hd.getFile()});
      }
    };
    await walk(FF.dir,FF.dir.name);
  }else if(FF.files){
    for(const f of FF.files){
      const dirs=f.webkitRelativePath.split('/').slice(1,-1);
      if((!sub&&dirs.length)||!dirs.every(okDir)||!flt.file(f.name))continue;
      out.push({name:f.name,path:f.webkitRelativePath,handle:null,getFile:async()=>f});
    }
  }
  return out;
}

async function findInFiles(){

/* ============================ file I/O ============================ */
const CP=['€','\x81','‚','ƒ','„','…','†','‡','ˆ','‰','Š','‹','Œ','\x8D','Ž','\x8F','\x90','‘','’','“','”','•','–','—','˜','™','š','›','œ','\x9D','ž','Ÿ'];
const CPREV=new Map(CP.map((c,i)=>[c,0x80+i]));
function encode(text,d){
  let t=text;
  if(d.eol==='CRLF')t=t.replace(/\n/g,'\r\n');else if(d.eol==='CR')t=t.replace(/\n/g,'\r');
  switch(d.enc){
    case'UTF-8':return new TextEncoder().encode(t);
    case'UTF-8 BOM':{const b=new TextEncoder().encode(t),o=new Uint8Array(b.length+3);o.set([0xEF,0xBB,0xBF]);o.set(b,3);return o}
    case'UTF-16 LE':case'UTF-16 BE':{
      const le=d.enc.endsWith('LE'),o=new Uint8Array(2+t.length*2);o[0]=le?0xFF:0xFE;o[1]=le?0xFE:0xFF;
      for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);o[2+i*2]=le?c&255:c>>8;o[3+i*2]=le?c>>8:c&255}
      return o;
    }
    default:{
      const o=new Uint8Array(t.length);
      for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);o[i]=(c<128||(c>=160&&c<=255))?c:(CPREV.get(t[i])||63)}
      return o;
    }
  }
}
async function readFile(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  let enc='UTF-8',text;
  if(buf[0]===0xEF&&buf[1]===0xBB&&buf[2]===0xBF){enc='UTF-8 BOM';text=new TextDecoder('utf-8').decode(buf.subarray(3))}
  else if(buf[0]===0xFF&&buf[1]===0xFE){enc='UTF-16 LE';text=new TextDecoder('utf-16le').decode(buf.subarray(2))}
  else if(buf[0]===0xFE&&buf[1]===0xFF){enc='UTF-16 BE';text=new TextDecoder('utf-16be').decode(buf.subarray(2))}
  else{try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){enc='ANSI';text=new TextDecoder('windows-1252').decode(buf)}}
  const crlf=(text.match(/\r\n/g)||[]).length,lf=(text.match(/(?<!\r)\n/g)||[]).length,cr=(text.match(/\r(?!\n)/g)||[]).length;
  const eol=crlf>0&&crlf>=lf&&crlf>=cr?'CRLF':(cr>lf&&cr>crlf?'CR':(lf>0?'LF':S.eol));
  return{text:text.replace(/\r\n?/g,'\n'),enc,eol};
}

/* ============================ hashing & text tools ============================ */
function md5(bytes){
  const K=new Uint32Array(64),S2=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];
  for(let i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)>>>0;
  const len=bytes.length,nb=((len+8)>>6)+1,w=new Uint32Array(nb*16);
  for(let i=0;i<len;i++)w[i>>2]|=bytes[i]<<((i%4)*8);
  w[len>>2]|=0x80<<((len%4)*8);
  w[nb*16-2]=(len*8)>>>0;w[nb*16-1]=Math.floor(len*8/4294967296);
  let a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;
  for(let i=0;i<nb;i++){
    let A=a0,B=b0,C=c0,D=d0;
    for(let j=0;j<64;j++){
      let F2,g;
      if(j<16){F2=(B&C)|(~B&D);g=j}
      else if(j<32){F2=(D&B)|(~D&C);g=(5*j+1)%16}
      else if(j<48){F2=B^C^D;g=(3*j+5)%16}
      else{F2=C^(B|~D);g=(7*j)%16}
      F2=(F2+A+K[j]+w[i*16+g])|0;
      A=D;D=C;C=B;
      const s=S2[(j>>4)*4+(j%4)];
      B=(B+((F2<<s)|(F2>>>(32-s))))|0;
    }
    a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0;
  }
  return[a0,b0,c0,d0].map(v=>{let s='';for(let i=0;i<4;i++)s+=((v>>>(i*8))&255).toString(16).padStart(2,'0');return s}).join('');
}
async function digest(algo,bytes){
  if(algo==='MD5')return md5(bytes);
  const r=await crypto.subtle.digest(algo,bytes);
  return[...new Uint8Array(r)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

  const box=h('textarea',{readonly:true,style:{width:'100%',height:'70px',fontFamily:'Consolas,monospace',userSelect:'text'}});box.value=out;

function moveCaret(d,o){
  const ta=d.ta,t=ta.value,s=ta.selectionStart,e=ta.selectionEnd,back=ta.selectionDirection==='backward';
  const anchor=back?e:s;let head=back?s:e;const ln=lineOf(d,head),col=head-d.ls[ln];
  const isW=c=>/\w/.test(c||'');
  switch(o.key){
    case'ArrowLeft':
      if(!o.shift&&s!==e){head=s;break}
      if(o.ctrl){while(head>0&&!isW(t[head-1]))head--;while(head>0&&isW(t[head-1]))head--}else head=Math.max(0,head-1);break;
    case'ArrowRight':
      if(!o.shift&&s!==e){head=e;break}
      if(o.ctrl){while(head<t.length&&isW(t[head]))head++;while(head<t.length&&!isW(t[head]))head++}else head=Math.min(t.length,head+1);break;
    case'ArrowUp':case'ArrowDown':{
      const nl=ln+(o.key==='ArrowUp'?-1:1);
      if(nl<0)head=0;else if(nl>=d.ls.length)head=t.length;else head=Math.min(d.ls[nl]+col,lineEnd(d,nl));break;
    }
    case'Home':{
      if(o.ctrl){head=0;break}
      const ind=d.ls[ln]+lineText(d,ln).match(/^[ \t]*/)[0].length;head=head===ind?d.ls[ln]:ind;break;
    }
    case'End':head=o.ctrl?t.length:lineEnd(d,ln);break;
    case'PageUp':case'PageDown':{
      const nl=Math.max(0,Math.min(d.ls.length-1,ln+(o.key==='PageUp'?-1:1)*Math.max(1,Math.floor(d.sc.clientHeight/LH))));
      head=Math.min(d.ls[nl]+col,lineEnd(d,nl));break;
    }
    default:return false;
  }
  if(o.shift)ta.setSelectionRange(Math.min(anchor,head),Math.max(anchor,head),head<anchor?'backward':'forward');
  else ta.setSelectionRange(head,head);
  caretChanged(d);return true;
}
function playKey(d,o){
  const fake={key:o.key,shiftKey:o.shift,ctrlKey:o.ctrl,metaKey:false,altKey:o.alt,isComposing:false,defaultPrevented:false,preventDefault(){this.defaultPrevented=true}};
  onEditorKey(d,fake);if(fake.defaultPrevented)return;
  if(moveCaret(d,o))return;
  const ta=d.ta,s=ta.selectionStart,e=ta.selectionEnd,k=o.key;
  if(o.ctrl||o.alt){
    const lk=k.toLowerCase();
    if(lk==='a'){ta.select();caretChanged(d)}
    else if(lk==='z')exec('undo');else if(lk==='y')exec('redo');
    else if(lk==='c'&&s!==e)clip(ta.value.slice(s,e),true);
    else if(lk==='x'&&s!==e){clip(ta.value.slice(s,e),true);replaceRange(d,s,e,'')}
    else if(o.ctrl&&k==='Backspace'){let p=s;while(p>0&&/\s/.test(ta.value[p-1]))p--;while(p>0&&/\w/.test(ta.value[p-1]))p--;replaceRange(d,p===s?Math.max(0,s-1):p,e,'')}
    else if(o.ctrl&&k==='Delete'){let p=e;while(p<ta.value.length&&/\w/.test(ta.value[p]))p++;while(p<ta.value.length&&/\s/.test(ta.value[p]))p++;replaceRange(d,s,p===e?e+1:p,'')}
    return;
  }
  if(k.length===1)replaceRange(d,s,e,k);
  else if(k==='Enter')replaceRange(d,s,e,'\n');
  else if(k==='Backspace'){if(s!==e)replaceRange(d,s,e,'');else if(s>0)replaceRange(d,s-1,s,'')}
  else if(k==='Delete'){if(s!==e)replaceRange(d,s,e,'');else if(s<ta.value.length)replaceRange(d,s,s+1,'')}
}
function playMacro(steps,times=1,toEnd=false){
  steps=steps||M.cur;
  if(M.rec){toast('Stop recording first');return}
  if(!steps||!steps.length){toast('No macro recorded');return}
  const d=cur;M.playing=true;
  try{
    for(let n=0;toEnd?n<100000:n<times;n++){
      const before=d.ta.selectionStart+'|'+d.ta.value.length;
      for(const st of steps){
        if(st.t==='cmd'){if(C[st.id])C[st.id].run()}
        else if(st.t==='ins')insertText(st.text);
        else playKey(cur,st);
      }
      if(toEnd&&(d.ta.selectionEnd>=d.ta.value.length||before===d.ta.selectionStart+'|'+d.ta.value.length))break;
    }
  }finally{M.playing=false}
  caretChanged(cur);
}

function columnEditor(){
  const rt=h('input',{type:'radio',name:'cem',checked:true}),rn=h('input',{type:'radio',name:'cem'});
  const txt=h('input',{type:'text',style:{width:'100%'}});
  const ini=h('input',{type:'number',value:1}),inc=h('input',{type:'number',value:1}),rep=h('input',{type:'number',value:1,min:1});
  const lz=h('input',{type:'checkbox'}),fmt=h('select',null,...[['10','Dec'],['16','Hex'],['8','Oct'],['2','Bin']].map(o=>h('option',{value:o[0]},o[1])));
  [ini,inc,rep].forEach(x=>x.style.width='90px');
  const body=h('div',null,h('label',null,rt,' Text to Insert'),h('div',{style:{margin:'4px 0 10px 20px'}},txt),
    h('label',null,rn,' Number to Insert'),
    h('div',{class:'frm',style:{margin:'4px 0 0 20px'}},h('label',null,'Initial number :'),ini,h('label',null,'Increase by :'),inc,h('label',null,'Repeat :'),rep,
      h('label',null,'Format :'),fmt,h('label',{style:{gridColumn:'1/3'}},lz,' Leading zeros')));
  txt.addEventListener('focus',()=>rt.checked=true);[ini,inc,rep].forEach(x=>x.addEventListener('focus',()=>rn.checked=true));
  const d=cur,s=d.ta.selectionStart,e=d.ta.selectionEnd;
  modal('Column / Multi-Editing',body,[{label:'OK',primary:true,fn:()=>{
    const l1=lineOf(d,s),l2=s!==e?lineOf(d,e):d.ls.length-1;
    const col=s-d.ls[l1],n=l2-l1+1,base=+fmt.value,a=+ini.value||0,b=+inc.value||0,r=Math.max(1,+rep.value||1);
    const vals=[];
    for(let i=0;i<n;i++){
      if(rt.checked)vals.push(txt.value);
      else{const v=a+Math.floor(i/r)*b;vals.push((v<0?'-':'')+Math.abs(v).toString(base).toUpperCase())}
    }
    if(rn.checked){const w=Math.max(...vals.map(v=>v.length));for(let i=0;i<n;i++)vals[i]=lz.checked?vals[i].replace(/^(-?)(.*)$/,(m,sg,x)=>sg+x.padStart(w-sg.length,'0')):vals[i].padStart(w,' ')}
    const lines=[];for(let i=l1;i<=l2;i++){const l=lineText(d,i);lines.push(l.length<col?l+' '.repeat(col-l.length)+vals[i-l1]:l.slice(0,col)+vals[i-l1]+l.slice(col))}
    const ss=d.ls[l1],se=lineEnd(d,l2);setTimeout(()=>{replaceRange(d,ss,se,lines.join('\n'));setSel(d,ss+col)},0);
  }},{label:'Cancel'}],{w:400});
}

/* ============================ session persistence ============================ */
let persistT=0;
function persistSoon(){clearTimeout(persistT);persistT=setTimeout(persist,700)}
function persist(){
  const mk=lite=>({active:docs.indexOf(cur),docs:docs.map(d=>{
    const mod=isMod(d);
    return{name:d.name,path:d.path,ro:d.ta.readOnly,lang:d.lang,eol:d.eol,enc:d.enc,mod,text:(lite&&!mod&&d.handle)?'':d.ta.value,saved:mod&&d.saved.length<200000?d.saved:null,
      bm:[...d.bm],sel:[d.ta.selectionStart,d.ta.selectionEnd],top:d.sc.scrollTop,left:d.sc.scrollLeft,hadHandle:!!d.handle,lite:lite&&!mod&&!!d.handle};
  })});
  if(!store.set('lpp.session',mk(false)))store.set('lpp.session',mk(true));
  saveSettings();
}
function restoreSession(){
  const s=store.get('lpp.session',null);
  if(!s||!s.docs||!s.docs.length)return false;
  for(const o of s.docs){
    const d=newDoc({name:o.name,path:o.path,ro:o.ro,lang:o.lang,eol:o.eol,enc:o.enc,text:o.text,bm:o.bm});
    d.saved=o.mod?(o.saved!=null?o.saved:'\u0000__dirty__'):o.text;
    d.restore=o;
    if(o.lite){d.ta.value='';d.saved='';}
  }
  const n=Math.max(0,Math.min(docs.length-1,s.active));
  activate(docs[n]);
  docs.forEach(d=>{const o=d.restore;if(!o)return;reindex(d);d.n=d.ls.length;d.ta.setSelectionRange(Math.min(o.sel[0],d.ta.value.length),Math.min(o.sel[1],d.ta.value.length))});
  render(cur);
  raf(()=>{const o=cur.restore;if(o){cur.sc.scrollTop=o.top;cur.sc.scrollLeft=o.left}});
  return true;
}

const KEYMAP=new Map();
for(const id in C)if(!C[id].native)for(const k of C[id].keys)KEYMAP.set(k,id);
function norm(e){
  let k=e.key;if(k==='Control'||k==='Shift'||k==='Alt'||k==='Meta'||k==='Dead')return'';
  const map={' ':'Space',ArrowUp:'Up',ArrowDown:'Down',ArrowLeft:'Left',ArrowRight:'Right',Escape:'Esc','+':'Plus',Add:'Plus',Subtract:'-',Delete:'Del'};
  k=map[k]||(k.length===1?k.toUpperCase():k);
  return(e.ctrlKey||e.metaKey?'Ctrl+':'')+(e.altKey?'Alt+':'')+(e.shiftKey?'Shift+':'')+k;
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(menus.length){closeMenus();return}
    if(ac){hideAC();return}
    if(!fd.hidden){closeFind();return}
    if(document.body.classList.contains('df')){document.body.classList.remove('df');return}
    return;
  }
  if(e.defaultPrevented||document.querySelector('.ov')||!cur)return;
  const k=norm(e);if(!k)return;
  const id=KEYMAP.get(k);if(!id)return;
  e.preventDefault();e.stopPropagation();
  closeMenus();C[id].run();
},false);

      const s=h('select',{onchange:()=>{S.bgImage=s.value;saveSettings();applyBg();if(s.value==='custom'&&!bgCustom)pickBgImage(()=>{})}});

function shortcutsDialog(){
  const filter=h('input',{type:'text',placeholder:'Filter...',style:{width:'100%',marginBottom:'8px'}});
  const tb=h('table',{class:'sk'});
  const fill=()=>{tb.innerHTML='';const q=filter.value.toLowerCase();for(const id in C){const c=C[id];if(!c.keys.length)continue;const ks=c.keys.map(fmtKey).join('  /  ');if(q&&!(c.label+ks).toLowerCase().includes(q))continue;tb.append(h('tr',null,h('td',null,c.label),h('td',null,ks)))}};
  filter.oninput=fill;fill();
  modal('Shortcut List',h('div',null,filter,h('div',{style:{maxHeight:'50vh',overflow:'auto'}},tb),h('p',{style:{opacity:.7,margin:'8px 0 0'}},'Browsers reserve Ctrl+N, Ctrl+T, Ctrl+W, Ctrl+Tab for themselves, so LocalPad++ also binds Alt+N / Alt+T / Alt+W / Alt+Left / Alt+Right.')),[{label:'Close',primary:true}],{w:620});

function paletteDialog(){
  const inp=h('input',{type:'text',placeholder:'Type a command...',style:{width:'100%',marginBottom:'6px'}});
  const ul=h('ul',{class:'pl'});let sel=0,items=[];
  const fill=()=>{
    const q=inp.value.toLowerCase();ul.innerHTML='';
    items=Object.values(C).filter(c=>!q||c.label.toLowerCase().includes(q));sel=0;
    items.slice(0,80).forEach((c,i)=>ul.append(h('li',{class:i?'':'on',onclick:()=>go(c)},h('span',null,c.label),h('span',null,c.keys[0]?fmtKey(c.keys[0]):''))));
  };
  let ovEl;
  const go=c=>{const b=ovEl.querySelector('button');b.click();setTimeout(()=>c.run(),0)};
  inp.oninput=fill;
  inp.addEventListener('keydown',e=>{
    const rows=ul.children;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();rows[sel]&&rows[sel].classList.remove('on');sel=(sel+(e.key==='ArrowDown'?1:-1)+rows.length)%rows.length;rows[sel].classList.add('on');rows[sel].scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();if(items[sel])go(items[sel])}
  },true);
  modal('Command Palette',h('div',null,inp,ul),[{label:'Close'}],{w:520,enter:false});
  ovEl=document.querySelector('.ov');fill();
}

  Ctrl+O  Open file(s)           Ctrl+S  Save              Ctrl+Shift+S  Save all
  Ctrl+F  Find                   Ctrl+H  Replace           Ctrl+Shift+F  Find in all open tabs

  Ctrl+Shift+Up/Down  Move line  Ctrl+Q  Toggle comment    Ctrl+F2       Toggle bookmark (F2 / Shift+F2: next / prev)
